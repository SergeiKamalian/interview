query AiCostAnalytics($filters: AiCostFilterInput) {
  aiCostAnalytics(filters: $filters) {
    kpi {
      totalCostUsd
      costPerInterview
      costPerCandidate
      totalRequests
    }
    byModel {
      model
      promptTokens
      completionTokens
      totalCostUsd
    }
    topExpensiveInterviews {
      interviewAttemptId
      interviewTitle
      totalCostUsd
      latencyMs
    }
    elevenLabs {
      kpi {
        totalCostUsd
        totalCharacters
        totalRequests
      }
      byOperation {
        operationType
        characterCount
        totalCostUsd
      }
    }
  }
}
