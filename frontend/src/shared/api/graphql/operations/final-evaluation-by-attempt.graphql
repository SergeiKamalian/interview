query FinalEvaluationByAttempt($attemptId: ID!) {
  finalEvaluationByAttempt(attemptId: $attemptId) {
    id
    interviewAttemptId
    totalScore
    category
    hireRecommendation
    summary
    detailedSummary
    strengths
    weaknesses
    risks
    needsManualReview
    categoryBreakdown {
      categoryKey
      categoryLabel
      scoreNormalized
      weight
      contribution
    }
  }
}
