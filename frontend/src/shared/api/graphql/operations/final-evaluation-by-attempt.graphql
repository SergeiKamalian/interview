query FinalEvaluationByAttempt($attemptId: ID!) {
  finalEvaluationByAttempt(attemptId: $attemptId) {
    id
    interviewAttemptId
    totalScore
    finalScore
    totalWeight
    averageScore
    strengthCategory
    category
    hireRecommendation
    summary
    detailedSummary
    strengths
    weaknesses
    risks
    needsManualReview
    categoryBreakdown {
      categoryKey
      categoryLabel
      scoreNormalized
      weight
      contribution
    }
    topicEvaluations {
      topic
      score
      weight
      weightedScore
      strengthCategory
    }
  }
}
