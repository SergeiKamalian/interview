mutation CreateInterviewTemplateFromInterview($interviewId: ID!, $title: String) {
  createInterviewTemplateFromInterview(interviewId: $interviewId, title: $title) {
    id
    title
    jobRole
    level
    interviewLanguage
    questionCount
    jobDescription
    professionId
    isVideoEnabled
    interviewerName
    welcomeMessageTemplate
    aiTone
    probingDepth
    scoringStrictness
    maxCompletions
    allowRetake
    timeLimitMinutes
    passingScore
    requirePhone
    requireLinkedin
    requireGithub
    status
    createdAt
    updatedAt
    questions {
      questionId
      sortOrder
    }
  }
}
