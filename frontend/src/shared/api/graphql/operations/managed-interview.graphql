query ManagedInterview($id: ID!) {
  interview(id: $id) {
    id
    title
    jobRole
    level
    interviewLanguage
    questionCount
    status
    publicToken
    publicUrl
    isVideoEnabled
    interviewerName
    welcomeMessageTemplate
    aiTone
    probingDepth
    scoringStrictness
    expiresAt
    maxCompletions
    allowRetake
    timeLimitMinutes
    passingScore
    requirePhone
    requireLinkedin
    requireGithub
  }
}
