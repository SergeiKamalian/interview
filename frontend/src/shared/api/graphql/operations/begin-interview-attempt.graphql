mutation BeginInterviewAttempt($input: BeginInterviewAttemptInput!) {
  beginInterviewAttempt(input: $input) {
    attemptId
    status
    isWelcomePending
    welcomeMessage
    totalQuestions
    answeredQuestions
    currentQuestionText
    currentQuestionId
    messages {
      id
      role
      content
      sequenceOrder
      messageKind
    }
  }
}
