query InterviewDetails($interviewId: ID!) {
  interviewDetails(interviewId: $interviewId) {
    id
    title
    jobRole
    status
    questionCount
    publicUrl
    createdAt
    evaluationStatus
    primaryFinalEvaluation {
      id
      totalScore
      finalScore
      totalWeight
      averageScore
      strengthCategory
      category
      hireRecommendation
      summary
      strengths
      weaknesses
      risks
      needsManualReview
      categoryBreakdown {
        categoryKey
        categoryLabel
        scoreNormalized
        weight
        contribution
      }
      topicEvaluations {
        topic
        score
        weight
        weightedScore
        strengthCategory
      }
    }
    attempts {
      attemptId
      candidateId
      candidateName
      candidateEmail
      status
      startedAt
      completedAt
      overallScore
      hireRecommendation
      evaluationStatus
    }
  }
}
