query InterviewDetails($interviewId: ID!) {
  interviewDetails(interviewId: $interviewId) {
    id
    title
    jobRole
    professionName
    level
    status
    questionCount
    publicUrl
    createdAt
    evaluationStatus
    skills
    questions {
      id
      sortOrder
      questionText
      level
      difficulty
      topicName
    }
    primaryFinalEvaluation {
      id
      totalScore
      finalScore
      totalWeight
      averageScore
      strengthCategory
      category
      hireRecommendation
      summary
      strengths
      weaknesses
      risks
      needsManualReview
      categoryBreakdown {
        categoryKey
        categoryLabel
        scoreNormalized
        weight
        contribution
      }
      topicEvaluations {
        topic
        score
        weight
        weightedScore
        strengthCategory
      }
    }
    attempts {
      attemptId
      candidateId
      candidateName
      candidateEmail
      status
      startedAt
      completedAt
      overallScore
      hireRecommendation
      evaluationStatus
      achievedLevel
      achievedLevelMethod
      needsManualReview
      shortlistStatus
      reviewStatus
      aiAssessmentVerdict
      companyDecision
      reviewedAt
      hasTeamNotes
    }
  }
}
