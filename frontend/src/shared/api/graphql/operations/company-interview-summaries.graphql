query CompanyInterviewSummaries($filters: CompanyInterviewSummariesFilterInput) {
  companyInterviewSummaries(filters: $filters) {
    items {
      interviewId
      title
      jobRole
      status
      level
      interviewLanguage
      questionCount
      publicUrl
      createdAt
      attemptsTotal
      attemptsCompleted
      attemptsInProgress
      attemptsAbandoned
      attemptsPending
      completionRate
      shortlistedCount
      strongInviteCount
      needsManualReviewCount
      avgScore
      lastActivityAt
    }
    total
    page
    pageSize
    facets {
      total
      active
      draft
      archived
      withAttempts
    }
  }
}
