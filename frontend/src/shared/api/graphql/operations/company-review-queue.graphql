query CompanyReviewQueue($filters: CompanyReviewQueueFilterInput) {
  companyReviewQueue(filters: $filters) {
    items {
      attemptId
      candidateId
      candidateName
      candidateEmail
      interviewId
      interviewTitle
      jobRole
      completedAt
      evaluationStatus
      totalScore
      hireRecommendation
      achievedLevel
      achievedLevelMethod
      needsManualReview
      shortlistStatus
    }
    total
    page
    pageSize
  }
}
