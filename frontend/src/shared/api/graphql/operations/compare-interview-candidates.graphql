mutation CompareInterviewCandidates($input: CompareInterviewCandidatesInput!) {
  compareInterviewCandidates(input: $input) {
    recommendedAttemptId
    recommendationTitle
    recommendationSummary
    decisionRationale
    ranking {
      attemptId
      rank
      headline
      tradeOff
    }
    useCases {
      title
      recommendedAttemptId
      rationale
    }
    candidateNotes {
      attemptId
      candidateName
      bestFor
      strengths
      risks
      followUpQuestions
    }
    caveats
  }
}
