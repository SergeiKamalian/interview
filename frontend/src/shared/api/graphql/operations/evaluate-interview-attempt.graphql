mutation EvaluateInterviewAttempt($attemptId: ID!) {
  evaluateInterviewAttempt(attemptId: $attemptId) {
    questionCount
    finalEvaluation {
      id
      totalScore
      category
      hireRecommendation
      summary
      needsManualReview
      categoryBreakdown {
        categoryKey
        categoryLabel
        scoreNormalized
        weight
        contribution
      }
    }
  }
}
