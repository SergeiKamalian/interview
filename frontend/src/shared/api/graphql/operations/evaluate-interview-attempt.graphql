mutation EvaluateInterviewAttempt($attemptId: ID!) {
  evaluateInterviewAttempt(attemptId: $attemptId) {
    questionCount
    finalEvaluation {
      id
      totalScore
      finalScore
      totalWeight
      averageScore
      strengthCategory
      category
      hireRecommendation
      summary
      needsManualReview
      categoryBreakdown {
        categoryKey
        categoryLabel
        scoreNormalized
        weight
        contribution
      }
      topicEvaluations {
        topic
        score
        weight
        weightedScore
        strengthCategory
      }
    }
  }
}
