mutation SubmitInterviewAnswer($input: SubmitInterviewAnswerInput!) {
  submitInterviewAnswer(input: $input) {
    status
    nextQuestionText
    pendingMessageText
    answeredQuestions
    totalQuestions
    answeredMainQuestions
    totalMainQuestions
    messageKind
    currentInterviewQuestionId
    isFollowUp
    currentQuestionFollowUpCount
  }
}
