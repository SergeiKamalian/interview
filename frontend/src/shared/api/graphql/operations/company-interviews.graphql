query CompanyInterviews($filters: CompanyInterviewsFilterInput) {
  companyInterviews(filters: $filters) {
    items {
      attemptId
      interviewId
      interviewTitle
      jobRole
      candidateName
      candidateEmail
      status
      startedAt
      completedAt
      overallScore
    }
    total
    page
    pageSize
  }
}
