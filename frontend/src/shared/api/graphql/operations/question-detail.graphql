query Question($id: ID!) {
  question(id: $id) {
    id
    questionText
    level
    difficulty
    isActive
    isCustom
    isRequired
    companyPriority
    status
    maxScore
    shortAnswer
    idealAnswer
    sourceQuestionId
    topic {
      id
      code
      name
      interviewWeight
      skill {
        id
        code
        name
      }
    }
    profession {
      id
      code
      name
    }
    skills {
      id
      code
      name
    }
    checkpoints {
      id
      checkpointKey
      title
      expected
      score
      sortOrder
      evaluationHints {
        mustConcepts
        falseClaims
      }
    }
    answerExamples {
      id
      exampleType
      exampleText
      sortOrder
    }
  }
}
