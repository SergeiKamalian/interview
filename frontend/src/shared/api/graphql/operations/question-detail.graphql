query Question($id: ID!) {
  question(id: $id) {
    id
    questionText
    level
    difficulty
    isActive
    shortAnswer
    idealAnswer
    topic {
      id
      code
      name
      interviewWeight
    }
    profession {
      id
      code
      name
    }
    checkpoints {
      id
      checkpointKey
      title
      expected
      score
      sortOrder
    }
    answerExamples {
      id
      exampleType
      exampleText
      sortOrder
    }
  }
}
