mutation CreateInterviewTemplate($input: CreateInterviewTemplateInput!) {
  createInterviewTemplate(input: $input) {
    id
    title
    jobRole
    level
    interviewLanguage
    questionCount
    jobDescription
    professionId
    isVideoEnabled
    interviewerName
    welcomeMessageTemplate
    aiTone
    probingDepth
    scoringStrictness
    maxCompletions
    allowRetake
    timeLimitMinutes
    passingScore
    requirePhone
    requireLinkedin
    requireGithub
    status
    createdAt
    updatedAt
    questions {
      questionId
      sortOrder
    }
  }
}
