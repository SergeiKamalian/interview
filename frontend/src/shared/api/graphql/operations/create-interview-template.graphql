mutation CreateInterviewTemplate($input: CreateInterviewTemplateInput!) {
  createInterviewTemplate(input: $input) {
    id
    title
    jobRole
    level
    interviewLanguage
    questionCount
    jobDescription
    professionId
    isVideoEnabled
    interviewerName
    welcomeMessageTemplate
    status
    createdAt
    updatedAt
    questions {
      questionId
      sortOrder
    }
  }
}
