query CandidateReport($candidateId: ID!) {
  candidateReport(candidateId: $candidateId) {
    candidateId
    fullName
    email
    phone
    linkedinUrl
    githubUrl
    shortlistStatus
    shortlistReason
    latestFinalEvaluation {
      id
      totalScore
      finalScore
      totalWeight
      averageScore
      strengthCategory
      category
      hireRecommendation
      achievedLevel
      achievedLevelMethod
      achievedLevelNote
      targetLevel
      levelBreakdown {
        level
        earned
        maxScore
        ratio
        passed
      }
      summary
      detailedSummary
      strengths
      weaknesses
      risks
      needsManualReview
      categoryBreakdown {
        categoryKey
        categoryLabel
        scoreNormalized
        weight
        contribution
      }
      topicEvaluations {
        topic
        score
        weight
        weightedScore
        strengthCategory
      }
    }
    interviewHistory {
      attemptId
      interviewId
      interviewTitle
      jobRole
      status
      completedAt
      totalScore
    }
  }
}
