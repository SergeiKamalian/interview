query CandidateReport($candidateId: ID!) {
  candidateReport(candidateId: $candidateId) {
    candidateId
    fullName
    email
    phone
    linkedinUrl
    githubUrl
    shortlistStatus
    shortlistReason
    latestFinalEvaluation {
      id
      totalScore
      category
      hireRecommendation
      summary
      detailedSummary
      strengths
      weaknesses
      risks
      needsManualReview
      categoryBreakdown {
        categoryKey
        categoryLabel
        scoreNormalized
        weight
        contribution
      }
    }
    interviewHistory {
      attemptId
      interviewId
      interviewTitle
      jobRole
      status
      completedAt
      totalScore
    }
  }
}
