query AttemptReviewDecisionHistory(
  $attemptId: ID!
  $filters: AttemptReviewDecisionHistoryFilterInput
) {
  attemptReviewDecisionHistory(attemptId: $attemptId, filters: $filters) {
    items {
      eventId
      source
      action
      previousValue
      newValue
      reason
      actorEmail
      actorName
      occurredAt
    }
    total
    page
    pageSize
  }
}
