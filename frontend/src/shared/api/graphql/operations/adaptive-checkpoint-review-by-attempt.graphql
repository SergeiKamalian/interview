query AdaptiveCheckpointReviewByAttempt($attemptId: ID!) {
  adaptiveCheckpointReviewByAttempt(attemptId: $attemptId) {
    attemptId
    needsManualReview
    redFlags {
      checkpointKey
      checkpointTitle
      summary
      candidateQuote
      severity
    }
    questionGroups {
      interviewQuestionId
      questionText
      idealAnswer
      needsManualReview
      checkpoints {
        checkpointKey
        checkpointTitle
        status
        scoreAwarded
        maxScore
        rationale
        evidenceSummary
        confidence
        needsManualReview
        depthLabel
        coveragePercent
        accuracyPercent
      }
    }
  }
}
