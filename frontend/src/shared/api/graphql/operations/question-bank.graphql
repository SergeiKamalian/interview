query QuestionBank($filters: QuestionBankFilterInput) {
  questionBank(filters: $filters) {
    total
    items {
      id
      questionText
      level
      difficulty
      maxScore
      isActive
      topic {
        id
        code
        name
      }
      profession {
        id
        code
        name
      }
      skills {
        id
        code
        name
      }
      checkpoints {
        id
        checkpointKey
        title
        expected
        score
        sortOrder
      }
      answerExamples {
        id
        exampleType
        exampleText
        sortOrder
      }
    }
  }
}

query Question($id: ID!) {
  question(id: $id) {
    id
    questionText
    level
    difficulty
    maxScore
    isActive
    shortAnswer
    idealAnswer
    topic {
      name
    }
    profession {
      name
    }
    checkpoints {
      title
      score
      sortOrder
    }
    answerExamples {
      exampleType
      exampleText
    }
  }
}
