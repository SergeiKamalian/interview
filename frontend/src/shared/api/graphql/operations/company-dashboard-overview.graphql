query CompanyDashboardOverview {
  companyDashboardOverview {
    metrics {
      candidatesTotal
      completedTotal
      inProgressTotal
      shortlistedTotal
      abandonedTotal
      needsReviewTotal
      strongInviteTotal
      completionRate
      interviewsTotal
      activeInterviewsTotal
    }
    interviewsTotal
    interviews {
      interviewId
      title
      jobRole
      status
      level
      interviewLanguage
      questionCount
      publicUrl
      createdAt
      attemptsTotal
      attemptsCompleted
      attemptsInProgress
      attemptsAbandoned
      attemptsPending
      completionRate
      shortlistedCount
      strongInviteCount
      needsManualReviewCount
      avgScore
      lastActivityAt
    }
    attentionItems {
      kind
      attemptId
      interviewId
      interviewTitle
      jobRole
      candidateId
      candidateName
      overallScore
      hireRecommendation
      occurredAt
    }
    shortlistTotal
    shortlistPreview {
      candidateId
      fullName
      email
      interviewsCount
      avgScore
      lastInterviewDate
    }
    weakTopics {
      topicName
      avgScore
      passRate
      sampleCount
    }
  }
}
