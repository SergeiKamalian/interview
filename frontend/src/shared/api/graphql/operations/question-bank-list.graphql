query QuestionBankList($filters: QuestionBankFilterInput) {
  questionBank(filters: $filters) {
    total
    items {
      id
      questionText
      level
      difficulty
      isActive
      topic {
        id
        code
        name
        interviewWeight
        skill {
          id
          code
          name
        }
      }
      profession {
        id
        code
        name
      }
    }
  }
}
