query MatchingCandidatesForLevel(
  $level: QuestionLevel!
  $professionId: ID!
  $skillIds: [ID!]
) {
  matchingCandidatesForLevel(
    level: $level
    professionId: $professionId
    skillIds: $skillIds
  ) {
    candidateId
    fullName
    email
    achievedLevel
    achievedLevelMethod
    sourceInterviewId
    sourceInterviewTitle
    professionId
    professionName
    matchedSkills
    matchedSkillCount
    completedAt
  }
}
