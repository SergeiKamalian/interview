query InterviewSession($publicToken: String!, $attemptId: ID!) {
  interviewSession(publicToken: $publicToken, attemptId: $attemptId) {
    attemptId
    status
    totalQuestions
    answeredQuestions
    currentQuestionText
    currentQuestionId
    welcomeMessage
    isWelcomePending
    messages {
      id
      role
      content
      sequenceOrder
      messageKind
      interviewQuestionId
      targetCheckpointKey
    }
  }
}
