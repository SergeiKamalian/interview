query CheckpointResultsByAttempt($attemptId: ID!) {
  checkpointResultsByAttempt(attemptId: $attemptId) {
    attemptId
    questionGroups {
      interviewQuestionId
      questionText
      needsManualReview
      checkpoints {
        id
        checkpointKey
        checkpointTitle
        status
        scoreAwarded
        maxScore
        evidenceQuote
        reasoningShort
      }
    }
  }
}
