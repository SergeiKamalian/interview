query InterviewAttemptsPage(
  $interviewId: ID!
  $filters: InterviewAttemptsFilterInput
) {
  interviewAttemptsPage(interviewId: $interviewId, filters: $filters) {
    total
    page
    pageSize
    items {
      attemptId
      candidateId
      candidateName
      candidateEmail
      status
      completedAt
      overallScore
      hireRecommendation
      evaluationStatus
      achievedLevel
      achievedLevelMethod
      needsManualReview
      shortlistStatus
      reviewStatus
      aiAssessmentVerdict
      companyDecision
      reviewedAt
      hasTeamNotes
    }
  }
}
