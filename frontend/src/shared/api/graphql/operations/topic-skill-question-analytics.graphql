query TopicSkillQuestionAnalytics($filters: TopicSkillQuestionFilterInput) {
  topicSkillQuestionAnalytics(filters: $filters) {
    totalCompletedAttempts
    lowSampleWarning
    topics {
      topicName
      avgScore
      passRate
      sampleCount
    }
    skills {
      skillName
      avgScore
      passRate
      sampleCount
    }
    questions {
      questionId
      questionText
      avgScore
      passRate
      sampleCount
    }
  }
}
